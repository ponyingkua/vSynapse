# vSynapse.yml
# Configuration for Synaptic.py -> vSch.py pipeline.
# Keep this file beside both Python files.

scanner:
  quote_asset: USDT
  market: futures
  min_quote_volume_24h: 5000000
  min_abs_change_24h: 4.0
  universe_size: 80
  max_results: 15
  min_score: 6.0

timeframes:
  primary:
    - 15m
    - 1h
    - 4h
  weights:
    15m: 0.25
    1h: 0.35
    4h: 0.40
  min_directional_agreement: 2

indicators:
  ema200:
    enabled: true
  volume:
    enabled: true
    baseline_period: 20
    confirmation_ratio: 1.5
  macd:
    enabled: true
    fast: 12
    slow: 26
    signal: 9
  rsi:
    enabled: true
    period: 14
  supertrend:
    enabled: true
    period: 10
    multiplier: 2.50

risk:
  atr_period: 14
  risk_reward:
    - 1.50
    - 2.25
    - 3.00
  max_risk_percent: 8.0
  max_entry_atr_distance: 2.75

visual:
  candles: true
  volume: true
  ema200: true
  show_entry: true
  show_tp: true
  show_sl: true
  show_invalidation: true
  chart_candles: 120
  dpi: 170
