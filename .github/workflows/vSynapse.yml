name: vSynapse

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: vsynapse
  cancel-in-progress: true

jobs:
  ngokeh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests matplotlib

      - name: Run Synaptic scanner
        run: |
          python Synaptic.py --out synaptic_candidates.json

      - name: Generate charts and summary text
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("synaptic_candidates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          candidates = data.get("candidates", [])

          if not candidates:
              print("No qualifying candidates found. Chart generation skipped.")
              Path("summary.txt").write_text("No qualifying candidates found for this scan run.\n", encoding="utf-8")
          else:
              print(f"Found {len(candidates)} candidates to process.")
              lines = [
                  f"=== SYNAPTIC SCAN SUMMARY ===",
                  f"Generated at (UTC): {data.get('generated_at', 'N/A')}",
                  f"Total Candidates: {len(candidates)}",
                  "=" * 40,
                  ""
              ]
              for idx, c in enumerate(candidates, 1):
                  lines.append(f"{idx}. Symbol: {c.get('symbol')} | Side: {c.get('side')} | Score: {c.get('score')}")
                  lines.append(f"   - Entry : {c.get('entry')}")
                  lines.append(f"   - SL    : {c.get('sl')}")
                  tps = c.get('tp', [])
                  lines.append(f"   - TP    : {', '.join(str(tp) for tp in tps)}")
                  lines.append(f"   - Invalidation: {c.get('invalidation')}")
                  lines.append("-" * 40)
              
              Path("summary.txt").write_text("\n".join(lines), encoding="utf-8")
          PY

          if python -c 'import json; print(bool(json.load(open("synaptic_candidates.json", encoding="utf-8")).get("candidates")))' | grep -q True; then
            python vSch.py --input synaptic_candidates.json
          else
            echo "No candidates; nothing to chart."
          fi

      - name: Upload Synaptic results (Charts & Summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsynapse-results
          path: |
            charts/
            summary.txt
          if-no-files-found: ignore
          retention-days: 7
