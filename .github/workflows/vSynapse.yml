name: vSynapse

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

env:
  # Naikkan (v1 -> v2 -> ...) tiap kali CONFIG di Synaptic.py diubah
  # secara berarti. Dipakai tracker.py buat tag config_version di
  # trade_log.json, supaya winrate_stats.json bisa dibandingkan
  # "sebelum vs sesudah" tanpa filter tanggal manual.
  SYNAPTIC_CONFIG_VERSION: "v1"

concurrency:
  group: vsynapse
  cancel-in-progress: false

jobs:
  ngokeh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests matplotlib

      - name: Run Synaptic scanner
        run: |
          python Synaptic.py --out synaptic_candidates.json

      - name: Generate charts and summary text
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("synaptic_candidates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          candidates = data.get("candidates", [])

          def fmt_num(value, decimals=None):
              if value is None:
                  return "N/A"

              try:
                  value = float(value)

                  if decimals is not None:
                      return f"{value:.{int(decimals)}f}"

                  text = f"{value:.12f}".rstrip("0").rstrip(".")
                  return text if text else "0"

              except (TypeError, ValueError):
                  return str(value)

          if not candidates:
              print("No qualifying candidates found. Chart generation skipped.")

              Path("summary.txt").write_text(
                  "=== SYNAPTIC SCAN SUMMARY ===\n"
                  f"Generated at (UTC): {data.get('generated_at', 'N/A')}\n"
                  "Total Candidates: 0\n"
                  "========================================\n\n"
                  "No qualifying candidates found for this scan run.\n",
                  encoding="utf-8"
              )

          else:
              print(f"Found {len(candidates)} candidates to process.")

              lines = [
                  "=== SYNAPTIC SCAN SUMMARY ===",
                  f"Generated at (UTC): {data.get('generated_at', 'N/A')}",
                  f"Total Candidates: {len(candidates)}",
                  "========================================",
                  ""
              ]

              for idx, c in enumerate(candidates, 1):
                  symbol = c.get("symbol", "N/A")
                  side = c.get("side", "N/A")
                  score = c.get("score", "N/A")
                  decimals = c.get("decimals")

                  lines.append(
                      f"{idx}. Symbol: {symbol} | "
                      f"Side: {side} | "
                      f"Score: {score}"
                  )

                  lines.append(
                      f"   - Entry : {fmt_num(c.get('entry'), decimals)}"
                  )

                  lines.append(
                      f"   - SL    : {fmt_num(c.get('sl'), decimals)}"
                  )

                  tps = c.get("tp", [])
                  formatted_tps = [
                      fmt_num(tp, decimals)
                      for tp in tps
                  ]

                  lines.append(
                      f"   - TP    : {', '.join(formatted_tps)}"
                  )

                  lines.append(
                      f"   - Invalidation: "
                      f"{c.get('invalidation', 'N/A')}"
                  )

                  lines.append("-" * 40)

              Path("summary.txt").write_text(
                  "\n".join(lines),
                  encoding="utf-8"
              )
          PY

          if python -c 'import json; print(bool(json.load(open("synaptic_candidates.json", encoding="utf-8")).get("candidates")))' | grep -q True; then
            python vSch.py --input synaptic_candidates.json
          else
            echo "No candidates; nothing to chart."
          fi

      - name: Create timestamped result folder
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")

          RESULT_DIR="docs/scan_results/$TIMESTAMP"

          mkdir -p "$RESULT_DIR"

          echo "RESULT_DIR=$RESULT_DIR" >> "$GITHUB_ENV"

          cp synaptic_candidates.json "$RESULT_DIR/"
          cp summary.txt "$RESULT_DIR/"

          if [ -d "charts" ]; then
            cp -r charts "$RESULT_DIR/"
          fi

          echo "========================================"
          echo "Synaptic result folder:"
          echo "$RESULT_DIR"
          echo "========================================"

      - name: Update win-rate tracker
        shell: bash
        run: |
          python docs/tracker.py \
            --results-dir docs/scan_results \
            --log trade_log.json \
            --stats-out winrate_stats.json \
            --config-version "${{ env.SYNAPTIC_CONFIG_VERSION }}"

      - name: Build belenggu dashboard
        shell: bash
        run: |
          python docs/belenggu.py \
            --results-dir docs/scan_results \
            --out docs/belenggu.html \
            --stats-file winrate_stats.json

      - name: Upload Synaptic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsynapse-results-${{ github.run_number }}
          path: |
            ${{ env.RESULT_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit scan results and dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/scan_results/
          git add docs/belenggu.html
          git add trade_log.json
          git add winrate_stats.json

          if git diff --cached --quiet; then
            echo "No new scan results or dashboard changes to commit."
            exit 0
          fi

          git commit -m "chore: Synaptic scan $RESULT_DIR"

          # Retry push: kalau remote sudah berubah (misal workflow lain baru push),
          # fetch + rebase lalu coba lagi, sampai 5 kali.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push berhasil."
              exit 0
            fi

            echo "Push gagal (percobaan $i), fetch + rebase lalu coba lagi..."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase konflik, batalkan rebase."
              git rebase --abort
              exit 1
            }
            sleep 5
          done

          echo "Gagal push setelah beberapa percobaan."
          exit 1