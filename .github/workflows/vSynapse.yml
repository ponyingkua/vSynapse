name: vSynapse

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vsynapse
  cancel-in-progress: false

jobs:
  ngokeh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests matplotlib

      - name: Run Synaptic scanner
        run: |
          python Synaptic.py --out synaptic_candidates.json

      - name: Generate charts and summary text
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("synaptic_candidates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          candidates = data.get("candidates", [])

          def fmt_num(value, decimals=None):
              """
              Format angka dengan jumlah desimal TETAP (fixed-point),
              bukan menebak lewat rstrip.

              PENTING:
              Versi lama memakai:
                  f"{value:.12f}".rstrip("0").rstrip(".")
              Ini membuang SEMUA trailing zero tanpa pandang bulu --
              termasuk nol yang MEMANG signifikan hasil pembulatan
              di Synaptic (mis. 4.8260 -> jadi "4.826", 0.070510 ->
              jadi "0.07051"). Akibatnya jumlah desimal antar entry/
              sl/tp dalam satu kandidat jadi tidak konsisten.

              Sekarang: kalau field "decimals" tersedia di kandidat
              (dikirim oleh Synaptic.py, sama persis dengan yang
              dipakai vSch.py untuk chart), pakai itu sebagai jumlah
              desimal tetap -- summary.txt jadi konsisten dengan chart.

              Kalau "decimals" tidak ada (kompatibilitas mundur ke
              JSON versi lama), baru fallback ke pembersihan
              floating-point noise seperti sebelumnya.
              """
              if value is None:
                  return "N/A"

              try:
                  value = float(value)

                  if decimals is not None:
                      return f"{value:.{int(decimals)}f}"

                  # Fallback lama -- hanya dipakai kalau JSON tidak
                  # menyediakan "decimals" sama sekali.
                  text = f"{value:.12f}".rstrip("0").rstrip(".")

                  return text if text else "0"
              except (TypeError, ValueError):
                  return str(value)

          if not candidates:
              print("No qualifying candidates found. Chart generation skipped.")

              Path("summary.txt").write_text(
                  "=== SYNAPTIC SCAN SUMMARY ===\n"
                  f"Generated at (UTC): {data.get('generated_at', 'N/A')}\n"
                  "Total Candidates: 0\n"
                  "========================================\n\n"
                  "No qualifying candidates found for this scan run.\n",
                  encoding="utf-8"
              )

          else:
              print(f"Found {len(candidates)} candidates to process.")

              lines = [
                  "=== SYNAPTIC SCAN SUMMARY ===",
                  f"Generated at (UTC): {data.get('generated_at', 'N/A')}",
                  f"Total Candidates: {len(candidates)}",
                  "========================================",
                  ""
              ]

              for idx, c in enumerate(candidates, 1):

                  symbol = c.get("symbol", "N/A")
                  side = c.get("side", "N/A")
                  score = c.get("score", "N/A")

                  # Jumlah desimal tetap untuk seluruh kandidat ini
                  # (entry/sl/tp) -- diambil dari Synaptic.py, sama
                  # dengan yang dipakai vSch.py untuk render chart.
                  decimals = c.get("decimals")

                  lines.append(
                      f"{idx}. Symbol: {symbol} | "
                      f"Side: {side} | "
                      f"Score: {score}"
                  )

                  lines.append(
                      f"   - Entry : {fmt_num(c.get('entry'), decimals)}"
                  )

                  lines.append(
                      f"   - SL    : {fmt_num(c.get('sl'), decimals)}"
                  )

                  tps = c.get("tp", [])

                  formatted_tps = [
                      fmt_num(tp, decimals)
                      for tp in tps
                  ]

                  lines.append(
                      f"   - TP    : {', '.join(formatted_tps)}"
                  )

                  lines.append(
                      f"   - Invalidation: "
                      f"{c.get('invalidation', 'N/A')}"
                  )

                  lines.append("-" * 40)

              Path("summary.txt").write_text(
                  "\n".join(lines),
                  encoding="utf-8"
              )

          PY

          if python -c 'import json; print(bool(json.load(open("synaptic_candidates.json", encoding="utf-8")).get("candidates")))' | grep -q True; then
            python vSch.py --input synaptic_candidates.json
          else
            echo "No candidates; nothing to chart."
          fi

      - name: Create timestamped result folder
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")

          RESULT_DIR="scan_results/$TIMESTAMP"

          mkdir -p "$RESULT_DIR"

          echo "RESULT_DIR=$RESULT_DIR" >> "$GITHUB_ENV"

          cp synaptic_candidates.json "$RESULT_DIR/"
          cp summary.txt "$RESULT_DIR/"

          if [ -d "charts" ]; then
            cp -r charts "$RESULT_DIR/"
          fi

          echo "========================================"
          echo "Synaptic result folder:"
          echo "$RESULT_DIR"
          echo "========================================"

      - name: Upload Synaptic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsynapse-results-${{ github.run_number }}
          path: |
            ${{ env.RESULT_DIR }}
          if-no-files-found: ignore
          retention-days: 7
   - name: Build dashboard
        shell: bash
        run: |
          python vDash.py --results-dir scan_results --out dashboard.html
      - name: Commit scan results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scan_results/

          if git diff --cached --quiet; then
            echo "No new scan results to commit."
            exit 0
          fi

          git commit -m "chore: Synaptic scan $RESULT_DIR"
          git push