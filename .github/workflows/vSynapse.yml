name: vSynapse

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: vsynapse
  cancel-in-progress: true

jobs:
  mungokeh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests matplotlib

      - name: Run Synaptic scanner
        run: |
          python Synaptic.py --out synaptic_candidates.json

      - name: Generate chart for top candidate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("synaptic_candidates.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          candidates = data.get("candidates", [])

          if not candidates:
              print("No qualifying candidates found. Chart generation skipped.")
          else:
              print(
                  f"Top candidate: {candidates[0]['symbol']} "
                  f"{candidates[0]['side']} "
                  f"score={candidates[0]['score']}"
              )
          PY

          if python -c 'import json; print(bool(json.load(open("synaptic_candidates.json", encoding="utf-8")).get("candidates")))' | grep -q True; then
            python vSch.py --input synaptic_candidates.json
          else
            echo "No candidates; nothing to chart."
          fi

      - name: Upload Synaptic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsynapse-results
          path: |
            synaptic_candidates.json
            *_chart.png
          if-no-files-found: ignore
          retention-days: 7
